robots:
  # NOTE: `type` patched for native-Windows execution. REALM's original custom
  # "DROID" robot Python class (realm/robots/droid_arm.py) was registered via the
  # old OmniGibson class-registry mechanism, which no longer exists in the current
  # OmniGibson -- robots are now purely data-driven, loaded from dataset YAML/USD
  # by `model` string (see REGISTERED_ROBOTS in omnigibson/robots/__init__.py).
  # The dataset ships a native "franka" model (the same physical Franka Panda arm
  # DROID is built on), so we point at that instead of authoring a full USD asset
  # for REALM's custom DROID gripper/camera mount. `name` stays "DROID" so the
  # rest of REALM's code (which branches on `if "DROID" in self.robot_name`)
  # keeps using its DROID-specific task/perturbation logic; only the physical
  # robot asset changes.
  # CAVEAT for the thesis: the pi0_fast_droid checkpoint was trained on the DROID
  # platform's specific gripper/camera geometry; using the stock Franka model here
  # is a documented approximation, not an exact reproduction.
  - name: "DROID"
    type: "franka"
    # NOTE: added -- native "franka" has 9 total DOF (7 arm + 2 standard parallel-jaw
    # gripper fingers), vs. 11 for REALM's original custom DROID gripper (7 arm + 4).
    # REALM's env_dynamic.py sizes the reset_joint_pos array from this "dof" key
    # (falling back to a hardcoded DROID_DEFAULT_DOF=11 if absent), which otherwise
    # mismatches franka's actual joint count.
    dof: 9
    obs_modalities: ["rgb", "proprio"]
    proprio_obs: ["joint_qpos"]
    control_freq: 15
    action_normalize: False
    action_type: "continuous"
    friction: [ 0.05, 0.10, 0.05, 0.10, 0.75, 0.425, 0.20 ]
    armature: [ 0.25, 0.50, 0.25, 0.50, 0.25, 0.150, 0.00 ]
    controller_name: "CustomJointController"
    controller_config:
        arm_0:
            name: "CustomJointController"
            "motor_type": "position"
            control_freq: 15
            use_delta_commands: False
            use_impedances: True
            use_gravity_compensation: False,
            use_cc_compensation: False,
            Kq: [ 40, 30, 50, 35, 35, 25, 10 ]
            Kqd: [ 4, 6, 5, 5, 3, 2, 1 ]
            Kx: [ 400, 400, 400, 15, 15, 15 ]
            Kxd: [ 37, 37, 37, 2, 2, 2 ]
            command_output_limits: null
            command_input_limits: null
            max_effort: [ 87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0 ]
            min_effort: [ -87.0, -87.0, -87.0, -87.0, -12.0, -12.0, -12.0 ]
        gripper_0:
          name: "CustomGripperController"
          mode: "binary"
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          # NOTE: patched -- reduced from REALM's 720x1280 (matching the #243/#432 fallback
          # already noted by REALM's own authors in camera_config.yaml) to shrink Isaac Sim's
          # RTX-renderer GPU footprint (framebuffers/denoiser buffers per camera). Needed to
          # share a single 16GB GPU with the pi0-fast/JAX policy server (see thesis Methodology
          # -- both processes run on native Windows / WSL2 on the same win2 GPU). pi0-fast
          # resizes observations internally regardless of raw render resolution, so this does
          # not change what the policy actually sees.
          image_height: 243
          image_width: 432
          focal_length: 2.8

