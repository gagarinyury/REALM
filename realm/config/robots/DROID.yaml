robots:
  # NOTE: REALM's original custom "DROID" robot Python class (realm/robots/droid_arm.py) was
  # registered through OmniGibson 1.1.1's class registry, which no longer exists -- robots are
  # now discovered by globbing `{gm.DATA_PATH}/*/models/<name>/<name>.yaml` (REGISTERED_ROBOTS
  # in omnigibson/robots/__init__.py) and instantiated as `Robot(**robot_config)`.
  #
  # We use the stock `franka_robotiq` model shipped with BEHAVIOR-1K, selected via the
  # `robotiq` end-effector variant of the `franka` definition. That is the same physical
  # platform DROID is built on (Franka Panda + Robotiq 2F-85) and, critically, it carries a
  # wrist camera at the `camera_link` link.
  #
  # Why not REALM's own realm/robots/panda_robotiq/droid.usd: current OmniGibson requires the
  # articulation graph to be a strict tree (prims/entity_prim.py::_compute_articulation_tree
  # asserts in-degree 1 for every non-root link), while that asset models the Robotiq 2F-85 as
  # a true parallel linkage with closed loops -- `inner_finger` is driven both by the base
  # prismatic joint and from `outer_finger`. It therefore cannot be loaded at all on this
  # engine, regardless of our code. (The asset additionally has two export slips: one
  # outer-finger joint reversed relative to its mirror, and the other targeting mesh prims
  # instead of links.)
  #
  # This matters far beyond robot fidelity: the wrist camera produces the observation key that
  # realm/inference/utils.py::extract_from_obs looks for. An earlier revision of this file
  # pointed at the stock `franka` model, which has no wrist camera at all -- REALM then
  # silently substituted a black 128x128 image, starving pi0-FAST of the view it was trained
  # on and pinning binary_SR at 0.00 across every rollout, with all other metrics still
  # looking plausible.
  #
  # CAVEAT for the thesis: this is the DROID platform, not REALM's exact DROID asset. The
  # wrist camera mounts on `panda_link7` as `camera_link` rather than on `panda_link8` as
  # `gripper_link_camera`, so the viewpoint differs slightly, and the gripper exposes 2
  # controlled joints instead of 4. Absolute success rates are therefore not directly
  # comparable to the paper's table; internal comparisons remain valid.
  - name: "DROID"
    model: "franka"
    end_effector: "robotiq"
    # 7 arm joints + 8 gripper joints, verified against the loaded articulation
    # (franka_robotiq reports 15 joints; proprio vector length is 15 accordingly).
    # REALM's env_dynamic.py sizes the reset_joint_pos array from this key, filling [:7].
    dof: 15
    obs_modalities: ["rgb", "proprio"]
    proprio_obs: ["joint_qpos"]
    control_freq: 15
    action_normalize: False
    action_type: "continuous"
    friction: [ 0.05, 0.10, 0.05, 0.10, 0.75, 0.425, 0.20 ]
    armature: [ 0.25, 0.50, 0.25, 0.50, 0.25, 0.150, 0.00 ]
    controller_name: "CustomJointController"
    controller_config:
        arm_0:
            name: "CustomJointController"
            "motor_type": "position"
            control_freq: 15
            use_delta_commands: False
            use_impedances: True
            use_gravity_compensation: False,
            use_cc_compensation: False,
            Kq: [ 40, 30, 50, 35, 35, 25, 10 ]
            Kqd: [ 4, 6, 5, 5, 3, 2, 1 ]
            Kx: [ 400, 400, 400, 15, 15, 15 ]
            Kxd: [ 37, 37, 37, 2, 2, 2 ]
            command_output_limits: null
            command_input_limits: null
            max_effort: [ 87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0 ]
            min_effort: [ -87.0, -87.0, -87.0, -87.0, -12.0, -12.0, -12.0 ]
        gripper_0:
          name: "CustomGripperController"
          mode: "binary"
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          # NOTE: patched -- reduced from REALM's 720x1280 (matching the #243/#432 fallback
          # already noted by REALM's own authors in camera_config.yaml) to shrink Isaac Sim's
          # RTX-renderer GPU footprint (framebuffers/denoiser buffers per camera). Needed to
          # share a single 16GB GPU with the pi0-fast/JAX policy server (see thesis Methodology
          # -- both processes run on native Windows / WSL2 on the same win2 GPU). pi0-fast
          # resizes observations internally regardless of raw render resolution, so this does
          # not change what the policy actually sees.
          image_height: 243
          image_width: 432
          focal_length: 2.8

