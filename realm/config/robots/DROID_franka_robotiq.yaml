robots:
  # Fallback configuration: the stock `franka_robotiq` model shipped with BEHAVIOR-1K, selected
  # via the `robotiq` end-effector variant of the `franka` definition. Use this when the asset
  # repair described in DROID.yaml is not available -- it needs no asset work at all.
  #
  # It is the same physical platform DROID is built on (Franka Panda + Robotiq 2F-85) and it
  # does carry a wrist camera, at the `camera_link` link. That last point is not a detail: an
  # earlier revision pointed at the plain `franka` model, which has no wrist camera, and REALM
  # silently substituted a black 128x128 image -- starving pi0-FAST of the view it was trained
  # on and pinning binary_SR at 0.00 across every rollout while all other metrics still looked
  # plausible.
  #
  # CAVEAT: this is the DROID platform, not REALM's own asset. The wrist camera mounts on
  # panda_link7 as `camera_link` rather than on panda_link8 as `gripper_link_camera`, so the
  # viewpoint differs, and the gripper linkage is not the original one. Absolute success rates
  # are therefore further from the paper's table than with the repaired asset.
  - name: "DROID"
    model: "franka"
    end_effector: "robotiq"
    # 7 arm joints + 8 gripper joints, verified against the loaded articulation
    # (franka_robotiq reports 15 joints; proprio vector length is 15 accordingly).
    # REALM's env_dynamic.py sizes the reset_joint_pos array from this key, filling [:7].
    dof: 15
    obs_modalities: ["rgb", "proprio"]
    proprio_obs: ["joint_qpos"]
    control_freq: 15
    action_normalize: False
    action_type: "continuous"
    friction: [ 0.05, 0.10, 0.05, 0.10, 0.75, 0.425, 0.20 ]
    armature: [ 0.25, 0.50, 0.25, 0.50, 0.25, 0.150, 0.00 ]
    controller_name: "CustomJointController"
    controller_config:
        arm_0:
            name: "CustomJointController"
            "motor_type": "position"
            control_freq: 15
            use_delta_commands: False
            use_impedances: True
            use_gravity_compensation: False,
            use_cc_compensation: False,
            Kq: [ 40, 30, 50, 35, 35, 25, 10 ]
            Kqd: [ 4, 6, 5, 5, 3, 2, 1 ]
            Kx: [ 400, 400, 400, 15, 15, 15 ]
            Kxd: [ 37, 37, 37, 2, 2, 2 ]
            command_output_limits: null
            command_input_limits: null
            max_effort: [ 87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0 ]
            min_effort: [ -87.0, -87.0, -87.0, -87.0, -12.0, -12.0, -12.0 ]
        gripper_0:
          name: "CustomGripperController"
          mode: "binary"
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          # NOTE: patched -- reduced from REALM's 720x1280 (matching the #243/#432 fallback
          # already noted by REALM's own authors in camera_config.yaml) to shrink Isaac Sim's
          # RTX-renderer GPU footprint (framebuffers/denoiser buffers per camera). Needed to
          # share a single 16GB GPU with the pi0-fast/JAX policy server (see thesis Methodology
          # -- both processes run on native Windows / WSL2 on the same win2 GPU). pi0-fast
          # resizes observations internally regardless of raw render resolution, so this does
          # not change what the policy actually sees.
          image_height: 243
          image_width: 432
          focal_length: 2.8
          # NOTE: patched -- must be set explicitly on OmniGibson >= 3.9.1. VisionSensor now
          # writes horizontalAperture at initialisation, defaulting it to 20.995, instead of
          # leaving whatever the camera prim authored. The wrist camera in droid.usd authors
          # 5.376 x 3.024, i.e. an 87.7 deg horizontal FOV; letting the engine default it
          # inflates the wrist view to roughly 150 deg, which is not the viewpoint pi0-FAST
          # was trained on. Credit: this default change was identified by REALM's author in
          # the upstream port-to-og391 branch.
          horizontal_aperture: 5.376

