# DROID robot definition for OmniGibson >= 3.x (data-driven robot registry).
#
# WHY THIS FILE EXISTS
# REALM ships its own DROID robot (Franka Panda + Robotiq 2F-85 + a wrist camera)
# as realm/robots/droid_arm.py, registered through OmniGibson 1.1.1's Python class
# registry. That registry no longer exists: robots are now discovered purely by
# globbing `{gm.DATA_PATH}/*/models/<name>/<name>.yaml` (omnigibson/robots/__init__.py),
# and `envs/env_base.py` lowercases the config's `type` to get the model name --
# hence "droid", so REALM's original `type: "DROID"` resolves here unchanged.
#
# Every value below is transcribed from REALM's own droid_arm.py, not invented.
# Link and joint names were verified against droid.usd itself with OpenUSD.
#
# The wrist camera is the point of this file: /panda/gripper_link_camera/Camera
# in droid.usd produces the observation key 'DROID:gripper_link_camera:Camera:0'
# that realm/inference/utils.py::extract_from_obs looks for. With the stock
# `franka` model that key is absent and REALM silently substitutes a black image,
# which starves pi0-fast of its wrist view and pins the success rate at zero.

raw_controller_order: ["arm_0", "gripper_0"]

# Stock controllers are named here on purpose. REALM's task configs
# (realm/config/robots/DROID.yaml) override both entries with its own
# CustomJointController / CustomGripperController via controller_config, so these
# only need to be names that always resolve in the engine's controller registry.
default_controllers:
  arm_0: JointController
  gripper_0: MultiFingerGripperController

# droid.usd carries the Robotiq 2F-85 sub-assets as sibling files with their
# http references rewritten to local relative paths (upstream REALM left them
# pointing at omniverse-content-production S3, which only resolved inside their
# Docker image's Omniverse cache).
usd_path: "models/droid/usd/droid.usd"

# From droid_arm.py::_default_robot_model_joint_pos -- 7 arm joints + 4 gripper.
# NOTE: droid.usd declares 17 driven joints, but the Robotiq 2F-85 is a closed
# parallel linkage, so several of them become loop-closure constraints rather
# than articulation DOFs. 11 is what REALM itself declared and what its
# controllers are written against; verify against the loaded articulation on the
# first run and adjust here if the engine reports a different DOF count.
default_joint_pos: [
  0.143628523,
  -0.597331285,
  0.00201173499,
  -2.38619041,
  0.267941624,
  1.97807848,
  -0.0898026153,
  0.0,
  0.0,
  0.0,
  0.0,
]

manipulation:
  arm_link_names:
    "0": ["panda_link0", "panda_link1", "panda_link2", "panda_link3", "panda_link4", "panda_link5", "panda_link6", "panda_link7"]
  arm_joint_names:
    "0": ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4", "panda_joint5", "panda_joint6", "panda_joint7"]
  eef_link_names:
    "0": "panda_link8"
  finger_link_names:
    "0": ["gripper_link_left_inner_finger", "gripper_link_right_inner_finger"]
  # Order matters: gripper_control_idx is derived from this list (robot.py::gripper_control_idx),
  # and REALM's droid_arm.py assumed gripper DOFs sit at indices 7..10.
  finger_joint_names:
    "0": ["left_inner_finger_prismatic_joint", "right_inner_finger_prismatic_joint", "left_inner_finger_joint", "right_inner_finger_joint"]
  teleop_rotation_offset:
    "0": [-1, 0, 0, 0]

# Assisted-grasp points are deliberately omitted. REALM's droid_arm.py declared
# them against panda_leftfinger / "panda_rightfigner" (sic) -- stock franka_panda
# link names that do not exist in droid.usd -- and it never mattered because
# REALM runs grasping_mode="physical", where assisted grasping is unused.
