[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t-client"
version = "0.1.0"
description = "Lightweight client for GR00T policy servers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.24",
    "Pillow>=9.0",
    "pyzmq>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
